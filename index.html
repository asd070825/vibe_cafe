<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>바이브 카페 - 주문서</title>

  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== 페이지 상단: 카페 헤더 ===== -->
  <header class="cafe-header">
    <!-- 카페 로고 이모지 -->
    <div class="cafe-logo" aria-hidden="true">☕</div>
    <!-- 카페 이름 -->
    <h1 class="cafe-name">바이브 카페</h1>
    <!-- 부제목 -->
    <p class="cafe-subtitle">당신의 하루에 바이브를 더하다</p>
  </header>

  <!-- ===== 주문서 메인 영역 ===== -->
  <main class="order-main">

    <!-- ── 탭 메뉴 ── -->
    <nav class="tab-nav" role="tablist">
      <!-- 주문하기 탭 (기본 선택) -->
      <button
        class="tab-btn active"
        id="tab-btn-order"
        role="tab"
        aria-selected="true"
        aria-controls="tab-order"
        data-tab="order"
      >☕ 주문하기</button>

      <!-- 주문 내역 탭 + 건수 배지 -->
      <button
        class="tab-btn"
        id="tab-btn-history"
        role="tab"
        aria-selected="false"
        aria-controls="tab-history"
        data-tab="history"
      >
        📋 주문 내역
        <!-- 주문 건수 배지: 주문이 없으면 숨김, JavaScript가 숫자를 채움 -->
        <span class="tab-badge hidden" id="order-badge">0</span>
      </button>
    </nav>

    <!-- ══════════════════════════════════════
         탭 패널 1: 주문하기
         (기존 주문서 폼 + 주문 확인 메시지)
         ══════════════════════════════════════ -->
    <div id="tab-order" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-order">

      <!--
        novalidate: 브라우저 기본 유효성 검사 비활성화
        이름 필수 검사 등 모든 유효성 검사는 script.js에서 처리
      -->
      <form id="order-form" novalidate>

        <!-- 1. 이름 (필수) -->
        <div class="form-group">
          <label for="customer-name">
            이름 <span class="required" aria-label="필수 항목">*</span>
          </label>
          <input
            type="text"
            id="customer-name"
            name="customerName"
            placeholder="주문자 이름을 입력하세요"
            autocomplete="name"
          />
        </div>

        <!-- 2. 전화번호 -->
        <div class="form-group">
          <label for="phone-number">전화번호</label>
          <input
            type="tel"
            id="phone-number"
            name="phoneNumber"
            placeholder="010-0000-0000"
            autocomplete="tel"
          />
        </div>

        <!-- 3. 음료 선택 (드롭다운) -->
        <div class="form-group">
          <label for="drink-select">음료 선택</label>
          <select id="drink-select" name="drink">
            <!-- 기본 안내 문구 (가격 없음) -->
            <option value="" data-price="0">-- 음료를 선택하세요 --</option>
            <!-- data-price: JavaScript가 가격을 읽을 수 있도록 숫자로 지정 -->
            <option value="americano"         data-price="3500">아메리카노 3,500원</option>
            <option value="caffe-latte"       data-price="4000">카페라떼 4,000원</option>
            <option value="caffe-mocha"       data-price="4500">카페모카 4,500원</option>
            <option value="vanilla-latte"     data-price="4500">바닐라라떼 4,500원</option>
            <option value="green-tea-latte"   data-price="4500">녹차라떼 4,500원</option>
            <option value="caramel-macchiato" data-price="5000">카라멜마끼아또 5,000원</option>
          </select>
        </div>

        <!-- 4. 사이즈 선택 (라디오 버튼) -->
        <div class="form-group">
          <!-- fieldset/legend으로 라디오 그룹을 의미론적으로 묶음 -->
          <fieldset>
            <legend>사이즈</legend>

            <div class="radio-group">
              <!-- S 사이즈 -->
              <label for="size-s">
                <input
                  type="radio"
                  id="size-s"
                  name="size"
                  value="s"
                  data-price="0"
                />
                S <span class="price-tag">+0원</span>
              </label>

              <!-- M 사이즈 (기본 선택) -->
              <label for="size-m">
                <input
                  type="radio"
                  id="size-m"
                  name="size"
                  value="m"
                  data-price="500"
                  checked
                />
                M <span class="price-tag">+500원</span>
              </label>

              <!-- L 사이즈 -->
              <label for="size-l">
                <input
                  type="radio"
                  id="size-l"
                  name="size"
                  value="l"
                  data-price="1000"
                />
                L <span class="price-tag">+1,000원</span>
              </label>
            </div>
          </fieldset>
        </div>

        <!-- 5. 추가 옵션 (체크박스) -->
        <div class="form-group">
          <!-- fieldset/legend으로 체크박스 그룹을 의미론적으로 묶음 -->
          <fieldset>
            <legend>추가 옵션</legend>

            <div class="checkbox-group">
              <!-- 샷 추가 -->
              <label for="option-shot">
                <input
                  type="checkbox"
                  id="option-shot"
                  name="options"
                  value="shot"
                  data-price="500"
                />
                샷 추가 <span class="price-tag">+500원</span>
              </label>

              <!-- 크림 추가 -->
              <label for="option-cream">
                <input
                  type="checkbox"
                  id="option-cream"
                  name="options"
                  value="cream"
                  data-price="500"
                />
                크림 추가 <span class="price-tag">+500원</span>
              </label>

              <!-- 시럽 추가 -->
              <label for="option-syrup">
                <input
                  type="checkbox"
                  id="option-syrup"
                  name="options"
                  value="syrup"
                  data-price="300"
                />
                시럽 추가 <span class="price-tag">+300원</span>
              </label>

              <!-- 디카페인 -->
              <label for="option-decaf">
                <input
                  type="checkbox"
                  id="option-decaf"
                  name="options"
                  value="decaf"
                  data-price="0"
                />
                디카페인 <span class="price-tag">+0원</span>
              </label>
            </div>
          </fieldset>
        </div>

        <!-- 6. 수량 -->
        <div class="form-group">
          <label for="quantity">수량</label>
          <input
            type="number"
            id="quantity"
            name="quantity"
            min="1"
            max="10"
            value="1"
          />
        </div>

        <!-- 7. 요청사항 -->
        <div class="form-group">
          <label for="request">요청사항</label>
          <textarea
            id="request"
            name="request"
            placeholder="요청사항을 입력하세요 (예: 얼음 적게, 뜨겁게 해주세요)"
            rows="4"
          ></textarea>
        </div>

        <!-- 8. 예상 금액 표시 영역 (주문하기 버튼 바로 위) -->
        <div class="estimated-price" id="estimated-price-area">
          예상 금액: <span id="estimated-price">0</span>원
        </div>

        <!-- 9 & 10. 주문하기 / 다시 작성 버튼 -->
        <div class="button-group">
          <!-- 주문하기 버튼 (type="submit"으로 폼 제출) -->
          <button type="submit" id="submit-btn" class="btn btn-primary">
            주문하기
          </button>

          <!-- 다시 작성 버튼 (type="reset"으로 폼 초기화) -->
          <button type="reset" id="reset-btn" class="btn btn-secondary">
            다시 작성
          </button>
        </div>

      </form><!-- /#order-form -->

      <!-- 11. 주문 확인 메시지 영역 (처음에는 숨김, JavaScript로 표시) -->
      <div id="order-confirmation" class="order-confirmation" hidden>
        <!-- 주문 완료 후 JavaScript가 여기에 확인 메시지를 동적으로 삽입 -->
      </div>

    </div><!-- /#tab-order -->

    <!-- ══════════════════════════════════════
         탭 패널 2: 주문 내역
         (JavaScript의 renderOrders()가 카드를 그림)
         ══════════════════════════════════════ -->
    <div id="tab-history" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-btn-history">

      <!-- 주문 카드 목록: JavaScript가 여기에 카드를 동적으로 삽입 -->
      <div id="order-list"></div>

      <!-- 합계 + 전체 삭제 버튼: 주문이 없으면 hidden -->
      <div id="order-summary" class="order-summary hidden">
        <span id="summary-text"></span>
        <button id="clear-all-btn" class="btn btn-danger">내역 모두 지우기</button>
      </div>

    </div><!-- /#tab-history -->

  </main><!-- /.order-main -->

  <!-- 자바스크립트 연결 (DOM 파싱 완료 후 실행되도록 body 끝에 배치) -->

  <!-- Supabase JS v2 CDN: script.js보다 먼저 로드해야 supabase 객체를 쓸 수 있음 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 주문서 동작 스크립트 -->
  <script src="script.js"></script>
</body>
</html>
